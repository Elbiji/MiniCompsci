<!doctype html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/output.css" rel="stylesheet">
  <title>MiniCompSci</title>
</head>
<body class="font-ubuntu overflow-x-hidden">
    <section class="flex max-w-6xl mx-auto relative items-center justify-center h-screen">
        <div class="flex-col space-y-2 text-center p-10 border-[1px] rounded-3xl  shadow-lg bg-gradient-to-br from-white to-gray-200/10 items-center justify-center">
            <div class="border-[1px] p-2 rounded-lg  inline-block bg-gradient-to-br from-white to-gray-200/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"  viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M392.8 65.2C375.8 60.3 358.1 70.2 353.2 87.2L225.2 535.2C220.3 552.2 230.2 569.9 247.2 574.8C264.2 579.7 281.9 569.8 286.8 552.8L414.8 104.8C419.7 87.8 409.8 70.1 392.8 65.2zM457.4 201.3C444.9 213.8 444.9 234.1 457.4 246.6L530.8 320L457.4 393.4C444.9 405.9 444.9 426.2 457.4 438.7C469.9 451.2 490.2 451.2 502.7 438.7L598.7 342.7C611.2 330.2 611.2 309.9 598.7 297.4L502.7 201.4C490.2 188.9 469.9 188.9 457.4 201.4zM182.7 201.3C170.2 188.8 149.9 188.8 137.4 201.3L41.4 297.3C28.9 309.8 28.9 330.1 41.4 342.6L137.4 438.6C149.9 451.1 170.2 451.1 182.7 438.6C195.2 426.1 195.2 405.8 182.7 393.3L109.3 320L182.6 246.6C195.1 234.1 195.1 213.8 182.6 201.3z"/></svg>                
            </div>
            <div class="pb-3">
                <h1 class="font-semibold text-3xl text-gray-800"> 
                    Sign up
                </h1>
                <p class="text-gray-400 text-sm">
                    Lets patch you up in a sec.
                </p>
            </div>
            <div class="space-y-6 pt-2 flex-col mx-auto justify-center items-center">
                <div class="flex justify-center">
                    <input id="email" placeholder="email" type="text" class="font- border-[1px] w-96 h-10 rounded-lg p-4 focus:outline-none font-ubuntu text-xs">
                </div>
                <div class="flex justify-center">
                    <input id="password" placeholder="password" type="password" class="border-[1px] w-96 h-10 rounded-lg p-4 focus:outline-none font-ubuntu text-xs">
                </div>
                <div class="border-[2px] text-xs p-4 border-blue-800 rounded-lg text-blue-800 bg-blue-100 font-semibold">
                    Password must atleast contain 6 characters.
                </div>
                <div id="error-message">
                </div>
                <button id="signup-btn" class="border-[1px] w-96 p-2 rounded-xl font-semibold hover:bg-gray-200/20 transition-all duration-200">
                   Create 
                </button>
            </div>
        </div>
    </section>
    <footer class="bg-white">
        <div class="text-gray-400 p-8 text-center border-t border-gray-100">
            © 2025 MiniCompSci. All rights reserved.
        </div>
    </footer>
    <script type="module" src="../src/util/signup.js"></script>
</body>
</html>
